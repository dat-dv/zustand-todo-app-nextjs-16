name: CI/CD Pipeline

on:
  push:
    branches: [Master]
  pull_request:
    branches: [Master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_IS_DEBUG: ${{ secrets.NEXT_PUBLIC_IS_DEBUG }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret-key-123' }}
      SQLITE_DB_PATH: ./data/sqlite.db
      NODE_ENV: test
      PORT: 3000
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run type-check

      - name: Prepare Database Folder
        run: mkdir -p data

      - name: Initialize Database
        run: npm run db:push

      - name: Run Unit Tests
        run: npm test

      - name: Build Project
        run: npm run build

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/Master'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer Webhook
        env:
          TODO_ZUSTAND_NEXTJS16_WEB_HOOK: ${{ secrets.TODO_ZUSTAND_NEXTJS16_WEB_HOOK }}
        run: |
          echo "🚀 Triggering deploy..."
          echo "🔗 Webhook URL: $TODO_ZUSTAND_NEXTJS16_WEB_HOOK"

          if [ -z "$TODO_ZUSTAND_NEXTJS16_WEB_HOOK" ]; then
            echo "❌ Missing webhook"
            exit 1
          fi

          curl -X POST "$TODO_ZUSTAND_NEXTJS16_WEB_HOOK"

          echo "✅ Deploy triggered"
